<header><h1>⚛️ Fizika · 9-sinf · Molekulaning massasi va o'lchami</h1><button class="b" id="th">🌓 Mavzu</button></header>

<script>
const $=s=>document.querySelector(s),R=Math.random,PI=Math.PI;
const sup=n=>String(n).replace(/-/g,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sci=(v,d=2)=>{const e=Math.floor(Math.log10(v));return (v/10**e).toFixed(d-1).replace('.',',')+'·10'+sup(e)};
const sub=n=>n==1?'':String(n).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
let C={};function col(){const s=getComputedStyle(document.documentElement);['tx','mu','ac','ac2','wa','cv','bd','p1','p2','p3'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
$('#th').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=(r.dataset.theme||(d?'dark':'light'))=='dark'?'light':'dark'};
const bt=(sel,f)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{document.querySelectorAll(sel).forEach(x=>x.classList.remove('on'));b.classList.add('on');f(b.dataset.v)});
const sl=(id,f)=>{const e=$('#'+id);e.oninput=()=>f(+e.value)};
const ans=(p,a)=>`<p>${p}</p><button class="b" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Javobni ko'rsat</button><div class="ans" hidden>${a}</div>`;
const btn=(id,t,v,on)=>`<button class="b${on?' on':''}" data-v="${v}">${t}</button>`;
const go=i=>`<button class="b" id="go${i}">⏸ To'xtatish</button><button class="b" id="rs${i}">↻ Qayta boshlash</button>`;
const D=[
{t:'1. Molekulalar',th:"Barcha moddalar mayda zarralar — molekulalardan tuzilgan. Molekulalar to'xtovsiz va tartibsiz harakatlanadi, bir-biri bilan tortishadi va itarishadi. Harorat qancha yuqori bo'lsa, ular shuncha tez harakatlanadi.",
ctl:`<div class="row" id="m1">${btn(0,'Holatlar','state',1)}${btn(0,'Diffuziya','diff')}${btn(0,'Broun harakati','brown')}${btn(0,'Kuchlar','force')}</div>
<div class="row" id="s1">${btn(0,'Qattiq','solid',1)}${btn(0,'Suyuq','liquid')}${btn(0,'Gaz','gas')}</div>
<div class="row"><label id="lT">Harorat: <b id="Tv">50</b> <input type="range" id="T" min="0" max="100" value="50"></label><label id="lr">Masofa r: <input type="range" id="rr" min="25" max="160" value="100"></label>${go(1)}</div>`,
rem:"Modda tuzilishining 3 qoidasi: 1) modda molekulalardan tuzilgan, ular orasida bo'shliq bor; 2) molekulalar to'xtovsiz tartibsiz harakatda; 3) molekulalar o'zaro tortishadi va itarishadi.",
q:["Qattiq jism, suyuqlik va gazda zarralar harakati qanday farq qiladi?","Haroratni oshirsangiz diffuziya qanday o'zgaradi?","Broun zarrasi nima uchun tartibsiz harakatlanadi?"],
sol:["Issiq choyda shakar nega tezroq eriydi?","Harorat yuqori → molekulalar tezroq harakatlanadi → diffuziya tezlashadi, shakar molekulalari suv bo'ylab tezroq tarqaladi."],
ind:[["Nega gaz idishning butun hajmini egallaydi, suyuqlik esa egallamaydi?","Gaz molekulalari orasidagi tortishish kuchi juda kuchsiz, ular erkin uchadi. Suyuqlikda tortishish kuchi molekulalarni bir-biriga yaqin ushlab turadi."],["Havoda changning mayda zarralari nega tartibsiz harakatlanadi?","Havo molekulalari zarrani har tomondan tartibsiz urib turadi — bu Broun harakati."]],
note:"Eslatma: model sxematik, molekulalar haqiqatda nihoyatda kichik va tez harakatlanadi."},
{t:'2. O\'lchami',th:"Molekula juda kichik, uni oddiy ko'z bilan ko'rib bo'lmaydi. Uning o'lchamini moy pardasi usuli bilan baholash mumkin: moy suv betida bir molekula qalinligidagi parda hosil qilib yoyiladi. Parda qalinligi d taxminan molekula diametriga teng.",
ctl:`<div class="row" id="m2">${btn(0,'Moy pardasi','film',1)}${btn(0,'Masshtab','scale')}</div>
<div class="row"><span id="f2"><label>V = <b id="Vv">0,04</b> mm³ <input type="range" id="V" min="0.01" max="0.1" step="0.01" value="0.04"></label> <label>S = <b id="Sv">400</b> sm² <input type="range" id="S" min="50" max="1000" step="10" value="400"></label> <button class="b" id="dr">💧 Tomizish</button></span><span id="z2" style="display:none"><label>Kattalashtirish <input type="range" id="Z" min="0" max="3" step="0.01" value="0"></label></span>${go(2)}</div>
<div class="note" id="o2"></div>`,
rem:"d = V / S. Molekula diametri taxminan 10⁻⁹ m = 1 nm tartibida. 1 nm = 10⁻⁹ m (metrning milliarddan bir ulushi).",
q:["S o'zgarmasa, V ni oshirsangiz d qanday o'zgaradi?","V o'zgarmasa, S ni oshirsangiz-chi?","Molekula diametri soch tolasidan taxminan necha marta kichik?"],
sol:["V = 0,04 mm³ = 4·10⁻¹¹ m³ moy tomchisi S = 0,04 m² dog' hosil qildi. d = ?","d = V/S = 4·10⁻¹¹ / 0,04 = 1·10⁻⁹ m = 1 nm."],
ind:[["V = 0,02 mm³, S = 0,05 m². d = ?","d = 2·10⁻¹¹ / 0,05 = 4·10⁻¹⁰ m."],["V = 0,03 mm³ moy 1 nm qalinlikdagi pardaga aylandi. Yuza S = ?","S = V/d = 3·10⁻¹¹ / 10⁻⁹ = 0,03 m² = 300 sm²."]],
extra:`<div class="card"><b>Molekula o'lchamlari (taxminiy)</b><div class="ov"><table><tr><th>Modda</th><th>Diametr</th></tr><tr><td>H₂O</td><td>≈ 2,8·10⁻¹⁰ m</td></tr><tr><td>O₂</td><td>≈ 3,5·10⁻¹⁰ m</td></tr><tr><td>CO₂</td><td>≈ 3,3·10⁻¹⁰ m</td></tr></table></div></div>`,
note:"Eslatma: molekulalar shar emas va o'lchami usulga qarab farq qiladi; moy molekulasi suv molekulasidan kattaroq, shuning uchun tajribada d ≈ 10⁻⁹ m olinadi."},
{t:'3. Massasi',th:"Bir molekulaning massasi juda kichik. Uni topish uchun moddaning molyar massasi M ni Avogadro doimiysi Nₐ ga bo'lamiz. Nₐ = 6,02·10²³ mol⁻¹ — bir moldagi molekulalar soni.",
ctl:`<div class="row" id="m3">${btn(0,'Suv H₂O','0',1)}${btn(0,'Kislorod O₂','1')}${btn(0,'CO₂','2')}${btn(0,'Vodorod H₂','3')}${btn(0,'Temir Fe','4')}</div>
<div class="row"><label>Namuna m = <b id="mv">10</b> g <input type="range" id="mm" min="1" max="100" value="10"></label><button class="b" id="go3">▶ Hisoblash</button></div><div class="note" id="o3"></div>`,
rem:"m₀ = M / Nₐ. Molekulalar soni N = m / m₀. Suv uchun m₀ ≈ 3·10⁻²⁶ kg.",
q:["Qaysi molekula eng og'ir, qaysi biri eng yengil?","Namuna massasi 2 marta oshsa, N necha marta oshadi?","Nega m₀ ning tartibi 10⁻²⁶ kg?"],
sol:["Kislorod (M = 32·10⁻³ kg/mol) molekulasining massasi m₀ = ?","m₀ = 32·10⁻³ / 6,02·10²³ ≈ 5,3·10⁻²⁶ kg."],
ind:[["CO₂ (M = 44·10⁻³ kg/mol) uchun m₀ = ?","m₀ = 44·10⁻³ / 6,02·10²³ ≈ 7,3·10⁻²⁶ kg."],["1 g suvda nechta molekula bor?","N = m·Nₐ/M = 10⁻³·6,02·10²³ / 18·10⁻³ ≈ 3,3·10²² ta."]],
note:"Eslatma: ekrandagi nuqtalar molekulalarni ifodalaydi, ularning har biri ko'plab molekulaga mos keladi."},
{t:'4. Nisbiy massa',th:"Atom massasini kilogrammda yozish noqulay. Shuning uchun uglerod-12 atomi massasining 1/12 qismi atom massa birligi (1 m.a.b. ≈ 1,66·10⁻²⁷ kg) deb olingan. Nisbiy massa shu birlik bilan necha marta og'irligini ko'rsatadi.",
ctl:`<div class="row" id="m4">${btn(0,'Tarozi','bal',1)}${btn(0,'Molekula konstruktori','mol')}</div>
<div class="row" id="e4">${btn(0,'H','0',1)}${btn(0,'C','1')}${btn(0,'N','2')}${btn(0,'O','3')}${btn(0,'Fe','4')}</div>
<div class="row" id="q4" style="display:none">Namuna:${btn(0,'H₂O','H2O')}${btn(0,'CO₂','CO2')}${btn(0,'NH₃','NH3')}${btn(0,'CH₄','CH4')}${btn(0,'O₂','O2')}<button class="b" id="cl4">🗑 Tozalash</button></div><div class="note" id="o4"></div>`,
rem:"Aᵣ = m₀ / (1/12 m₀C), Mᵣ = ΣAᵣ. Nisbiy massa o'lchamsiz kattalik (birligi yo'q)!",
q:["Aᵣ(O) nechaga teng? O atomi H dan necha marta og'ir?","Nisbiy massaning o'lchov birligi bormi?","O₂ va CO₂ ning Mᵣ ini solishtiring."],
sol:["CO₂ ning nisbiy molekulyar massasini toping.","Mᵣ(CO₂) = Aᵣ(C) + 2·Aᵣ(O) = 12 + 2·16 = 44."],
ind:[["CH₄ ning Mᵣ = ?","Mᵣ = 12 + 4·1 = 16."],["NH₃ ning Mᵣ = ?","Mᵣ = 14 + 3·1 = 17."]],
note:"Eslatma: darslikda Aᵣ butun songacha yaxlitlanadi (H = 1, C = 12, N = 14, O = 16, Fe = 56)."}];
const nav=$('#nav'),main=$('#main'),S=[];let cur=0;
D.forEach((d,i)=>{nav.insertAdjacentHTML('beforeend',`<button class="b${i?'':' on'}" data-i="${i}">${d.t}</button>`);
main.insertAdjacentHTML('beforeend',`<section id="t${i}" class="${i?'':'on'}"><div class="card"><h2>${d.t}</h2><p>${d.th}</p></div><div class="card"><canvas id="c${i+1}" width="640" height="360"></canvas>${d.ctl}</div><div class="card rem"><b>📌 Eslab qol:</b> ${d.rem}<div class="note">${d.note}</div></div><div class="card"><b>🔎 Kuzat va javob ber</b><ol>${d.q.map(q=>`<li>${q}</li>`).join('')}</ol></div><div class="card"><b>✏️ Yechilgan masala</b>${ans(d.sol[0],d.sol[1])}<b>Mustaqil masalalar</b>${d.ind.map((p,k)=>ans((k+1)+') '+p[0],p[1])).join('')}</div>${d.extra||''}</section>`)});
nav.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;cur=+b.dataset.i;nav.querySelectorAll('.b').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==cur))};
const mk=(n,f)=>Array.from({length:n},(_,i)=>f(i));
function arrow(x,a,b,c,d,k){x.strokeStyle=x.fillStyle=k;x.lineWidth=4;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const t=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-12*Math.cos(t-.5),d-12*Math.sin(t-.5));x.lineTo(c-12*Math.cos(t+.5),d-12*Math.sin(t+.5));x.fill()}
function dot(x,px,py,r,k){x.fillStyle=k;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
function txt(x,s,px,py,k,sz){x.fillStyle=k||C.tx;x.font=(sz||18)+'px system-ui';x.fillText(s,px,py)}
// 1
S[0]=(()=>{const x=$('#c1').getContext('2d');let md='state',st='solid',T=50,rr=100,run=1,P=[],B,tr=[];
function reset(){tr=[];if(md=='state'){P=st=='solid'?mk(70,i=>{const hx=110+(i%10)*44,hy=60+Math.floor(i/10)*40;return{x:hx,y:hy,hx,hy,vx:0,vy:0}}):st=='liquid'?mk(70,()=>({x:30+R()*580,y:190+R()*150,a:R()*6.28})):mk(70,()=>({x:20+R()*600,y:20+R()*320,a:R()*6.28}))}
else if(md=='diff')P=mk(120,i=>({d:i<30,x:i<30?300+R()*40:20+R()*600,y:i<30?150+R()*40:20+R()*320,a:R()*6.28}));
else if(md=='brown'){P=mk(110,()=>{const a=R()*6.28;return{x:20+R()*600,y:20+R()*320,vx:Math.cos(a)*2,vy:Math.sin(a)*2}});B={x:320,y:180,vx:0,vy:0}}}
function sep(){for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<20){const f=(20-d)/2/d;a.x-=dx*f;a.y-=dy*f;b.x+=dx*f;b.y+=dy*f}}}
function wall(p,y0){if(p.x<8||p.x>632){p.a=PI-p.a;p.vx*=-1}if(p.y<y0||p.y>352){p.a=-p.a;p.vy*=-1}p.x=Math.max(8,Math.min(632,p.x));p.y=Math.max(y0,Math.min(352,p.y))}
function step(){if(md=='state'){if(st=='solid')P.forEach(p=>{p.vx=(p.vx+(p.hx-p.x)*.06)*.88+(R()-.5)*(.3+T*.05);p.vy=(p.vy+(p.hy-p.y)*.06)*.88+(R()-.5)*(.3+T*.05);p.x+=p.vx;p.y+=p.vy});
else if(st=='liquid'){P.forEach(p=>{p.a+=(R()-.5)*.8;const v=.5+T*.03;p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;wall(p,175)});sep()}
else P.forEach(p=>{const v=1+T*.07;p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;wall(p,8)})}
else if(md=='diff')P.forEach(p=>{p.a+=(R()-.5)*1.4;const v=.6+T*.04;p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;wall(p,8)});
else if(md=='brown'){const k=(1.5+T*.04)/2;P.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;if(p.x<8||p.x>632)p.vx*=-1;if(p.y<8||p.y>352)p.vy*=-1;const dx=p.x-B.x,dy=p.y-B.y,d=Math.hypot(dx,dy);if(d<28){const nx=dx/d,ny=dy/d,vr=(p.vx-B.vx)*nx+(p.vy-B.vy)*ny;if(vr<0){const j=-2*vr/(1+1/30);p.vx+=j*nx;p.vy+=j*ny;B.vx-=j*nx/30;B.vy-=j*ny/30}p.x=B.x+nx*28;p.y=B.y+ny*28}});
B.vx*=.99;B.vy*=.99;B.x+=B.vx*k;B.y+=B.vy*k;if(B.x<24||B.x>616)B.vx*=-1;if(B.y<24||B.y>336)B.vy*=-1;B.x=Math.max(24,Math.min(616,B.x));B.y=Math.max(24,Math.min(336,B.y));tr.push([B.x,B.y]);if(tr.length>400)tr.shift()}}
function draw(){x.clearRect(0,0,640,360);x.strokeStyle=C.bd;x.lineWidth=2;x.strokeRect(4,4,632,352);
if(md=='state'&&st=='liquid'){x.fillStyle=C.p1+'33';x.fillRect(5,175,630,180)}
if(md=='force'){const r0=60,cx=320,cy=180,ax=cx-rr/2,bx=cx+rr/2;dot(x,ax,cy,22,C.p1);dot(x,bx,cy,22,C.p3);
if(rr<r0-4){const L=Math.min(60,(r0-rr)*2+10);arrow(x,ax-24,cy,ax-24-L,cy,C.p2);arrow(x,bx+24,cy,bx+24+L,cy,C.p2);txt(x,"Itarilish kuchi ←→ (qizil)",200,60,C.p2,20)}
else if(rr>r0+4){const f=(rr-r0)*Math.exp(-(rr-r0)/25),L=Math.min(60,f*5+8);arrow(x,ax+24,cy,ax+24+L,cy,C.ac2);arrow(x,bx-24,cy,bx-24-L,cy,C.ac2);txt(x,"Tortishish kuchi →← (yashil)",190,60,C.ac2,20)}else txt(x,"Muvozanat: kuchlar teng",210,60,C.tx,20);txt(x,"r kichik bo'lsa itarilish, katta bo'lsa tortishish ustun",90,330,C.mu,16);return}
if(md=='brown'){x.strokeStyle=C.p2;x.lineWidth=2;x.beginPath();tr.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();P.forEach(p=>dot(x,p.x,p.y,5,C.p1));dot(x,B.x,B.y,22,C.p3);txt(x,"Katta zarra izi: tartibsiz yo'l",14,28,C.mu,16);return}
P.forEach(p=>dot(x,p.x,p.y,md=='diff'?6:7,md=='diff'?(p.d?C.p2:C.p1+'88'):C.p1));
txt(x,md=='diff'?"Bo'yoq (to'q sariq) suvga aralashyapti":st=='solid'?"Qattiq: joyida tebranadi":st=='liquid'?"Suyuq: sirpanadi, hajmi saqlanadi":"Gaz: erkin uchadi",14,28,C.mu,16)}
function show(){$('#s1').style.display=md=='state'?'':'none';$('#lT').style.display=md=='force'?'none':'';$('#lr').style.display=md=='force'?'':'none'}
bt('#m1 .b',v=>{md=v;show();reset()});bt('#s1 .b',v=>{st=v;reset()});sl('T',v=>{T=v;$('#Tv').textContent=v});sl('rr',v=>rr=v);
$('#go1').onclick=e=>{run=!run;e.target.textContent=run?"⏸ To'xtatish":"▶ Boshlash"};$('#rs1').onclick=reset;reset();show();
return{f(){if(run)step();draw()}}})();
// 2
S[1]=(()=>{const x=$('#c2').getContext('2d');let md='film',V=.04,Sa=400,p=1,z=0,run=1;
const L=["Soch tolasi ≈ 7·10⁻⁵ m","Hujayra ≈ 10⁻⁵ m","Molekula (H₂O) ≈ 10⁻⁹ m","Atom ≈ 10⁻¹⁰ m"];
function upd(){$('#Vv').textContent=String(V).replace('.',',');$('#Sv').textContent=Sa;const d=V*1e4/Sa;$('#o2').innerHTML='d = V/S = '+(V*1e-9).toExponential(1).replace('e-','·10⁻').replace('.',',')+' m³ / '+(Sa*1e-4).toFixed(3).replace('.',',')+' m² = <b>'+d.toFixed(2).replace('.',',')+'·10⁻⁹ m</b> ('+d.toFixed(2).replace('.',',')+' nm)'}
function shape(i,a,s){x.save();x.globalAlpha=a;x.translate(320,170);x.scale(s,s);x.fillStyle=C.p1;x.strokeStyle=C.p1;
if(i==0){x.fillStyle=C.p2;x.fillRect(-14,-140,28,280)}
else if(i==1){dot(x,0,0,100,C.p3+'99');dot(x,15,10,40,C.p3)}
else if(i==2){dot(x,0,0,40,C.p2);dot(x,-48,34,24,C.p1);dot(x,48,34,24,C.p1)}
else{dot(x,0,0,34,C.p1);x.lineWidth=2;x.beginPath();x.ellipse(0,0,100,40,.5,0,7);x.stroke();dot(x,Math.cos(Date.now()/300)*100*Math.cos(.5)-Math.sin(Date.now()/300)*40*Math.sin(.5),Math.cos(Date.now()/300)*100*Math.sin(.5)+Math.sin(Date.now()/300)*40*Math.cos(.5),8,C.p3)}x.restore()}
